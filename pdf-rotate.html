<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <title>PDF Rotator Online - Rotate PDF Pages Free | PikaTools</title>
    <meta name="description" content="Rotate PDF pages online for free with PikaTools. Easily rotate PDF pages clockwise or counterclockwise and download your rotated PDF quickly.">
    <meta name="keywords" content="PDF rotator, rotate PDF online, rotate PDF pages, PDF page rotation, rotate PDF file, online PDF rotator, free PDF rotator">
    <meta name="robots" content="index, follow">

    <link rel="canonical" href="https://everythinghere99.github.io/pikatools/tools/pdf-rotate.html">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" href="../icon-192.png">

    <meta property="og:title" content="PDF Rotator Online - PikaTools">
    <meta property="og:description" content="Rotate PDF pages online for free with PikaTools. Easily rotate and download your PDF.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://everythinghere99.github.io/pikatools/tools/pdf-rotate.html">

    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pdf-rotate.css?v=5">
</head>
<body>

<header class="topbar">
  <a href="../index.html" class="back-btn">←</a>
  <a href="../index.html" class="brand">PikaTools</a>
</header>

<main class="page">
  <h1 class="tool-title"><span>✦</span>PDF Rotate<span>✦</span></h1>

  <section class="card">
    <label class="drop-zone" id="dropZone">
      <div class="upload-icon">🔄</div>
      <h2>Drop your PDF here</h2>
      <p>or choose a PDF from your device</p>
      <span class="choose-btn">Choose PDF</span>
      <small>PDF • One file at a time</small>
      <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden>
    </label>

    <div id="workspace" class="workspace hidden">
      <div class="workspace-top">
        <div class="file-info">
          <div class="file-icon">PDF</div>
          <div>
            <div id="fileName" class="file-name"></div>
            <div id="fileMeta" class="file-meta"></div>
          </div>
        </div>
      </div>

      <div class="action-bar">
        <div class="selection-info"><b id="selectedCount">0</b> pages selected</div>
        <div class="action-right">
          <button id="selectAllBtn" class="small-btn" type="button">Select All</button>
          <button id="clearBtn" class="small-btn" type="button">Clear</button>
        </div>
      </div>

      <div class="rotate-controls">
        <button id="rotateLeftBtn" class="rotate-btn" type="button" disabled>↶ <span>Rotate Left</span></button>
        <button id="rotateRightBtn" class="rotate-btn" type="button" disabled>↷ <span>Rotate Right</span></button>
        <button id="rotateAllBtn" class="rotate-all-btn" type="button">🔄 <span>Rotate All 90°</span></button>
      </div>

      <div class="preview-heading">
        <div>
          <h2>PDF Preview</h2>
          <p>Select pages and rotate them. The preview updates instantly.</p>
        </div>
      </div>

      <div id="pageGrid" class="page-grid"></div>

      <button id="downloadBtn" class="download-btn" type="button" disabled>Download Rotated PDF</button>
      <button id="resetBtn" class="reset-btn hidden" type="button">Rotate Another PDF</button>
      <div id="status" class="status"></div>
    </div>
  </section>

  <section class="privacy">
    <span>🔒</span>
    <div>
      <b>Your PDF stays private.</b>
      <p>PDF rotation happens directly in your browser. Your file is not uploaded to a server.</p>
    </div>
  </section>
</main>

<script src="pdf-rotate.js?v=5" type="module"></script>
</body>
</html>
