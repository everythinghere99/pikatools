<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PikaTools - PDF Merger</title>

<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pdf-merger.css">
</head>

<body>

<header class="topbar">
  <a href="../index.html" class="back-btn">←</a>
  <div class="brand">PikaTools</div>
</header>

<main class="page">

  <h1 class="tool-title">
    <span>✦</span>PDF Merger<span>✦</span>
  </h1>

  <section class="card">

    <!-- INITIAL UPLOAD -->
    <label class="drop-zone" id="dropZone">
      <div class="upload-icon">🔗</div>

      <h2>Drop your PDFs here</h2>
      <p>or choose multiple PDFs from your device</p>

      <span class="choose-btn">Choose PDFs</span>

      <small>PDF • Multiple files supported</small>

      <input
        id="fileInput"
        type="file"
        accept="application/pdf,.pdf"
        multiple
        hidden
      >
    </label>


    <!-- WORKSPACE -->
    <div id="workspace" class="workspace hidden">

      <div class="list-heading">
        <div>
          <h2>Your PDFs</h2>
          <p id="fileCount">0 PDFs selected</p>
        </div>
      </div>


      <!-- PDF LIST -->
      <div id="pdfList" class="pdf-list"></div>


      <!-- ADD MORE -->
      <label class="add-more-btn">
        <span>＋</span>
        <span>Add More PDFs</span>

        <input
          id="addMoreInput"
          type="file"
          accept="application/pdf,.pdf"
          multiple
          hidden
        >
      </label>


      <!-- MERGE -->
      <button id="mergeBtn" class="merge-btn" type="button">
        Merge PDFs
      </button>


      <!-- DOWNLOAD -->
      <button id="downloadBtn" class="download-btn hidden" type="button">
        Download Merged PDF
      </button>


      <!-- RESET -->
      <button id="resetBtn" class="reset-btn hidden" type="button">
        Merge Another PDFs
      </button>


      <div id="status" class="status"></div>

    </div>

  </section>


  <section class="privacy">
    <span>🔒</span>

    <div>
      <b>Your PDFs stay private.</b>
      <p>PDF merging happens directly in your browser. Your files are not uploaded to a server.</p>
    </div>
  </section>

</main>

<script src="pdf-merger.js" type="module"></script>

</body>
</html>
